<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ajax 단원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

</head>
<body>
	<div class="container">
		<h2>AJAX 테스트</h2>
		
		<lable>이름</lable><input type="text" id="nameInput" class="form-control col-3">
		<lable>생년월일</lable><input type="text" id="birthdayInput" class="form-control col-3">
		<button type="button" id="inputBtn" class="btn btn-primary mt-3">입력</button>
		
		
		<!-- 입력한 이름과 생년월일을 서버에 전달해서 이름과 나이를 얻어와 새로고침 없이 표시한다 -->
		
		<div>이름 : <span id="nameSpan"></span></div>
		<div>나이 : <span id="ageSpan"></span></div>
		
		
		
		
		<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
		<script type="text/javascript">
		
			$("#inputBtn").on("click", function() {
				let name = $("#nameInput").val();
				let birthday = $("#birthdayInput").val();

				$.ajax({
					type:"get"
					, url:"/ajax/person"
					, data:{"name":name, "birthday":birthday}
					, success: function(response) {
						// 요청에 대한 응답이 성공적으로 들어왔을 때 수항하는 기능을 적는 곳
						// response 라고 적은 이유는 저 responseBody 에 저장된 json 이 여기에 저장이 된다.
						// 해당 함수의 파라미터를 통해 response body 데이터를 전달받는다.
						//              json = javascript 
						// json 문자열.
						// {"name":"김인규", "age":32}
						// 얘를 손쉽게 사용하도록 responsebody 에 담긴 json 문자열을 javascript 에서 손쉽게 사용하도록
						// json 문자열을 javascript 객체로 변환해준다.
						
						//alert(response.name + " " + response.age);
						
						$("#nameSpan").text(response.name);
						$("#ageSpan").text(response.age);
					}
					
				});
				
				
			});
		
		
		
		
		</script>
		
	</div>
	
</body>
</html>
