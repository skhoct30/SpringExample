<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Thymeleaf 반복문</title>
</head>
<body>

	<h3>Thymeleaf 반복문</h3>
	
	<h3>1. 숫자 반복문</h3>
	<!-- 0 1 2 3 4 -->
	<div th:each="i:${#numbers.sequence(0, 4)}" th:text="${i}"></div>
	
	<h3>2. 문자열 리스트</h3>
	<!-- for(String fruit:fruitList) 향상된 for문 자바에서 사용했던거 -->
	<div th:each="fruit:${fruitList}">
		<span th:text="${fruit}"></span>
	</div>
	
	
</body>
</html>
